name: Bundle 37 — Production read-only health and auth
on:
  push:
    paths:
      - '.github/workflows/test-bundle37-production.yml'
      - 'Bundle-37/qa/production-readonly.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check production health, CORS and authorization without writing data
        run: node Bundle-37/qa/production-readonly.mjs
