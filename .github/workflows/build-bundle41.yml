name: Bundle 41 — Verify Letters victory effects and pack changes-only ZIP
on:
  push:
    paths:
      - '.github/workflows/build-bundle41.yml'
      - 'Bundle-41/src/**'
      - 'Bundle-41/qa/**'
  workflow_dispatch:
concurrency:
  group: bundle41-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install offline type and syntax checking tools
        run: npm install --no-save --no-audit --no-fund esbuild@0.25.12 typescript@5.8.3 react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - name: Regression checks (confirmed win, both screens, original sound and mute)
        run: node Bundle-41/qa/check-bundle41.mjs
      - name: Compile real UI TSX and CSS syntax
        run: |
          for tsx in RoomLobby HostGameControls LettersVictoryEffects; do
            ./node_modules/.bin/esbuild "Bundle-41/src/letters/$tsx.tsx" --bundle --external:* --format=esm --target=es2022 --outfile="/tmp/$tsx.js"
            test -s "/tmp/$tsx.js"
          done
          ./node_modules/.bin/esbuild Bundle-41/src/letters/LettersVictoryEffects.css --outfile=/tmp/b41effects.css
      - name: Strict typecheck new and updated React components against real room contract shapes
        run: |
          mkdir -p .qa41/src/letters
          cp Bundle-41/src/letters/*.tsx .qa41/src/letters/
          cp Bundle-41/src/letters/LettersVictoryEffects.css .qa41/src/letters/
          cat > .qa41/src/letters/engine.ts <<'TS'
          export type Team=0|1;
          export type BestOf=1|3|5;
          export type Stage='lobby'|'playing'|'question'|'between_rounds'|'finished'|'abandoned';
          export interface Common {
            id:string;teams:[string,string];round:number;wins:[number,number];stage:Stage;
            owners:('orange'|'green'|null)[];letters:string[];currentCell:number|null;
            startingCell:number;turn:Team|null;winner:Team|null;winningPath:number[];
            revision:number;
          }
          export interface MatchState extends Common {
            bestOf:BestOf;question:{id:string;text:string;letter:string;answer:string;revealed:boolean}|null;
          }
          export interface DisplayState extends Common {
            bestOf:BestOf;question:{text:string;letter:string;revealedAnswer?:string}|null;
          }
          export function colorForTeam(t:Team,round:number):'orange'|'green'{
            return (t===0?round%2===1:round%2===0)?'orange':'green';
          }
          TS
          cat > .qa41/src/letters/roomClient.ts <<'TS'
          import type {MatchState,DisplayState,BestOf} from './engine';
          export class RoomApiError extends Error{constructor(public status:number,public code:string,message:string){super(message);}}
          export interface Summary {code:string;revision:number;displayConnected:boolean;}
          export interface HostRoom {room:Summary;hostState:MatchState;displayUrl:string;}
          export interface ViewerRoom {room:Summary;state:DisplayState;}
          export type RoomCommand={kind:string;cell?:number;requireWinConfirmation?:boolean};
          export const roomApi:{
            host:(code:string)=>Promise<HostRoom>;
            viewer:(code:string)=>Promise<ViewerRoom>;
            active:()=>Promise<{room:HostRoom|null}>;
            join:(code:string)=>Promise<ViewerRoom>;
            create:(input:{teams:[string,string];bestOf:BestOf})=>Promise<HostRoom>;
            counts:(code:string)=>Promise<{counts:Record<string,number>}>;
            command:(code:string,revision:number,command:RoomCommand,id:string)=>Promise<HostRoom>;
          }=undefined!;
          export const watchHostRoom:(
            code:string,ok:(room:HostRoom)=>void,fail:()=>void
          )=>()=>void=undefined!;
          export const watchRoom:(
            code:string,ok:(room:ViewerRoom)=>void,fail:()=>void
          )=>()=>void=undefined!;
          TS
          cat > .qa41/src/sfx.ts <<'TS'
          export function unlockGameAudio():void{}
          export function playGameSound(kind:'win'|'question'|'reveal'|'correct'|'next'|'pit'|'trap'):void{void kind;}
          TS
          printf "declare module '*.css';\n" > .qa41/global.d.ts
          cat > .qa41/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"strict":true,"noEmit":true,"jsx":"react-jsx","skipLibCheck":true,"allowSyntheticDefaultImports":true,"types":["react","react-dom"]},"include":["./src/letters/**/*.tsx","./src/sfx.ts","./global.d.ts"]}
          JSON
          ./node_modules/.bin/tsc -p .qa41/tsconfig.json
      - name: Build ZIP with EXACTLY four changed files
        run: |
          cd Bundle-41
          rm -f Changes-Only.zip
          touch -t 202601010101 src/letters/RoomLobby.tsx src/letters/HostGameControls.tsx src/letters/LettersVictoryEffects.tsx src/letters/LettersVictoryEffects.css
          zip -X -9 -q Changes-Only.zip src/letters/RoomLobby.tsx src/letters/HostGameControls.tsx src/letters/LettersVictoryEffects.tsx src/letters/LettersVictoryEffects.css
          unzip -Z1 Changes-Only.zip | sort > /tmp/b41-actual
          printf '%s\n' src/letters/RoomLobby.tsx src/letters/HostGameControls.tsx src/letters/LettersVictoryEffects.tsx src/letters/LettersVictoryEffects.css | sort > /tmp/b41-expected
          diff -u /tmp/b41-expected /tmp/b41-actual
          unzip -t Changes-Only.zip
      - name: Commit verified changes-only ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-41/Changes-Only.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle 41: tested Letters win fanfare and confetti changes-only ZIP'
            git fetch origin main
            git rebase origin/main
            git push
          fi
