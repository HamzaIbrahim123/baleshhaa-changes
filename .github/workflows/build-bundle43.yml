name: Bundle 43 — merged Seen Jeem entry + fixed Letters team colors
on:
  push:
    paths:
      - '.github/workflows/build-bundle43.yml'
      - 'Bundle-43/src/**'
      - 'Bundle-43/backend/rooms/**'
      - 'Bundle-43/qa/**'
  workflow_dispatch:
concurrency:
  group: bundle43
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend check tools
        run: npm install --no-fund --no-audit --no-save esbuild@0.25.12 typescript@5.8.3
      - name: Run regression checks and full multi-round scoring tests
        run: |
          node Bundle-43/qa/check-bundle43.mjs
          node Bundle-37/qa/win-confirmation.mjs
          node Bundle-35/qa/server-contracts.mjs
      - name: Check JSX parser and strict Typescript engine
        run: |
          ./node_modules/.bin/esbuild Bundle-43/src/App.tsx --bundle --external:* --format=esm --target=es2022 --outfile=/tmp/b43-app.js
          ./node_modules/.bin/tsc Bundle-43/src/letters/engine.ts --noEmit --strict --target ES2022 --lib ES2022,DOM --moduleResolution Bundler --module ESNext --skipLibCheck
          test -s /tmp/b43-app.js
      - name: Build Neon rooms backend from unchanged Bundle 37 service plus new engine
        run: |
          mkdir -p .qa43/rooms/dist Bundle-43/backend/build
          cp Bundle-37/backend/rooms/*.mjs .qa43/rooms/
          cp Bundle-43/backend/rooms/engine.mjs .qa43/rooms/engine.mjs
          cp Bundle-25/backend/rooms/package.json .qa43/rooms/
          npm install --prefix .qa43/rooms --no-fund --no-audit
          cat > .qa43/rooms/dist/banner.js <<'EOF'
          import { createRequire as __createRequire } from 'node:module';
          const require = __createRequire(import.meta.url);
          EOF
          ./node_modules/.bin/esbuild .qa43/rooms/index.mjs --bundle --platform=node --format=esm --target=node24 --external:pg-native --banner:js="$(cat .qa43/rooms/dist/banner.js)" --outfile=.qa43/rooms/dist/index.mjs
          printf '{"type":"module","private":true}' > .qa43/rooms/dist/package.json
          touch -t 202601010101 .qa43/rooms/dist/index.mjs .qa43/rooms/dist/package.json
          (cd .qa43/rooms/dist && zip -X -q ../../../Bundle-43/backend/build/rooms-function.zip index.mjs package.json)
          base64 -w 0 Bundle-43/backend/build/rooms-function.zip > Bundle-43/backend/build/rooms-function.b64.txt
          unzip -t Bundle-43/backend/build/rooms-function.zip
      - name: Package exactly two changed Figma Make files
        run: |
          cd Bundle-43
          rm -f Changes-Only.zip
          touch -t 202601010101 src/App.tsx src/letters/engine.ts
          zip -X -9 -q Changes-Only.zip src/App.tsx src/letters/engine.ts
          unzip -Z1 Changes-Only.zip | sort > /tmp/actual-b43.txt
          printf '%s\n' src/App.tsx src/letters/engine.ts | sort > /tmp/expected-b43.txt
          diff -u /tmp/expected-b43.txt /tmp/actual-b43.txt
          unzip -t Changes-Only.zip
      - name: Commit verified UI and independent Neon build artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-43/Changes-Only.zip Bundle-43/backend/build/rooms-function.zip Bundle-43/backend/build/rooms-function.b64.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle 43: verified two-file UI ZIP and fixed-color Neon rooms bundle'
            git fetch origin main
            git rebase origin/main
            git push
          fi
