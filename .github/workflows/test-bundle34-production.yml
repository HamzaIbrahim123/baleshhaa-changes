name: Bundle 34 — Production rooms read-only smoke test
on:
  push:
    paths:
      - '.github/workflows/test-bundle34-production.yml'
      - 'Bundle-34/qa/production-readonly-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-function-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production function health, CORS and authorization without writes
        run: node Bundle-34/qa/production-readonly-smoke.mjs
