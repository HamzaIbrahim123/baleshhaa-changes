name: Bundle 29 - Offline letter win scenarios and changes-only ZIP
on:
  push:
    paths:
      - '.github/workflows/build-bundle29.yml'
      - 'Bundle-29/src/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install QA compiler dependencies
        run: npm install --no-audit --no-fund --no-save typescript@5.8.3 esbuild@0.25.12 react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - name: Strict TypeScript and TSX parsing
        run: |
          mkdir -p .qa29/src/letters
          cp Bundle-24/src/letters/engine.ts .qa29/src/letters/engine.ts
          cp Bundle-29/src/letters/LettersDemo.tsx Bundle-29/src/letters/LettersEntry.tsx Bundle-29/src/letters/*.css .qa29/src/letters/
          printf "declare module '*.css';\n" > .qa29/global.d.ts
          cat > .qa29/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM","DOM.Iterable"],"strict":true,"noEmit":true,"jsx":"react-jsx","skipLibCheck":true,"allowSyntheticDefaultImports":true,"types":["react","react-dom"]},"include":["./src/letters/**/*.ts","./src/letters/**/*.tsx","./global.d.ts"]}
          JSON
          ./node_modules/.bin/tsc -p .qa29/tsconfig.json
          ./node_modules/.bin/esbuild Bundle-29/src/App.tsx --format=esm --outfile=/tmp/bundle29-app.js
          ./node_modules/.bin/esbuild .qa29/src/letters/engine.ts --format=esm --outfile=/tmp/bundle29-engine.mjs
      - name: Confirm winning routes and offline isolation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {winningPath, CELL_COUNT} from '/tmp/bundle29-engine.mjs';
          const make=(color, cells) => {const a=Array(CELL_COUNT).fill(null); for(const i of cells)a[i]=color; return a;};
          const examples=[
            ['orange',[10,11,12,13,14]],
            ['orange',[5,6,12,13,14]],
            ['green',[2,7,12,17,22]],
            ['green',[1,6,12,17,23]]
          ];
          for(const [color,cells] of examples)assert.ok(winningPath(make(color,cells),color).length>=5,color+':'+cells.join(','));
          assert.equal(winningPath(make('orange',[10,11,12,13]),'orange').length,0);
          const scattered=make('orange',[0,6,13,21]);
          for(const i of [4,8,16,24])scattered[i]='green';
          assert.equal(winningPath(scattered,'orange').length,0);
          assert.equal(winningPath(scattered,'green').length,0);
          assert.equal(winningPath(make('orange',[2,7,12,17,22]),'orange').length,0);
          assert.equal(winningPath(make('green',[10,11,12,13,14]),'green').length,0);
          const app=fs.readFileSync('Bundle-29/src/App.tsx','utf8');
          const entry=fs.readFileSync('Bundle-29/src/letters/LettersEntry.tsx','utf8');
          const demo=fs.readFileSync('Bundle-29/src/letters/LettersDemo.tsx','utf8');
          assert.match(app,/page==='letters-demo'&&<LettersDemo onBack=/);
          assert.match(app,/onDemo=\{\(\)=>go\('letters-demo'\)\}/);
          assert.match(app,/page==='letters-host'&&<LettersRoomLobby/);
          assert.match(app,/page==='letters-viewer'&&<LettersRoomLobby/);
          assert.match(entry,/onClick=\{onDemo\}>تجربة اللوحة الآن/);
          assert.match(demo,/winningPath\(owners,'orange'\)/);
          assert.match(demo,/winningPath\(owners,'green'\)/);
          assert.doesNotMatch(demo,/roomApi|\bfetch\(|localStorage|sessionStorage|DATABASE_URL|VITE_LETTERS_ROOM_API_BASE/);
          console.log('Six preset outcomes, two direction guards, isolation and integration passed.');
          JS
      - name: Build one ZIP with exactly five changed files
        run: |
          cd Bundle-29
          zip -q Changes-Only.zip src/App.tsx src/letters/LettersEntry.tsx src/letters/LettersEntry.css src/letters/LettersDemo.tsx src/letters/LettersDemo.css
          unzip -Z1 Changes-Only.zip | sort > /tmp/actual29.txt
          printf '%s\n' src/App.tsx src/letters/LettersEntry.tsx src/letters/LettersEntry.css src/letters/LettersDemo.tsx src/letters/LettersDemo.css | sort > /tmp/expected29.txt
          diff -u /tmp/expected29.txt /tmp/actual29.txt
          unzip -t Changes-Only.zip
      - name: Commit verified single ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-29/Changes-Only.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build Bundle 29 offline test changes-only ZIP'
            git push
          fi
