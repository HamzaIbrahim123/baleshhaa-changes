name: Performance — bounded QA baseline
on:
  push:
    paths:
      - '.github/workflows/performance-qa-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baleshhaa-qa-load-baseline
  cancel-in-progress: false
jobs:
  baseline:
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Five rooms / ten simulated devices — QA only
        run: node Performance/qa-baseline.mjs
