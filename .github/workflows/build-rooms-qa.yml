name: Bundle Neon QA rooms function
on:
  push:
    paths:
      - '.github/workflows/build-rooms-qa.yml'
      - 'Bundle-25/backend/rooms/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install room dependencies and build tools
        working-directory: Bundle-25/backend/rooms
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund esbuild
      - name: Produce self-contained Neon ESM function
        working-directory: Bundle-25/backend/rooms
        run: |
          mkdir -p dist
          cat > dist/banner.js <<'EOF'
          import { createRequire as __createRequire } from 'node:module';
          const require = __createRequire(import.meta.url);
          EOF
          ./node_modules/.bin/esbuild index.mjs --bundle --platform=node --format=esm --target=node24 --external:pg-native --banner:js="$(cat dist/banner.js)" --outfile=dist/index.mjs
          printf '{"type":"module","private":true}' > dist/package.json
          cd dist
          zip -q ../../../../qa-neonrooms-built.zip index.mjs package.json
      - name: Commit QA build to changes repository (not production)
        run: |
          mkdir -p Bundle-26/qa
          cp qa-neonrooms-built.zip Bundle-26/qa/neonrooms-built.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bundle-26/qa/neonrooms-built.zip
          if ! git diff --cached --quiet; then git commit -m "Build QA-only Neon rooms function bundle"; git push; fi
