name: Bundle 40 — Compile UI and build changes-only ZIP
on:
  push:
    paths:
      - '.github/workflows/build-bundle40.yml'
      - 'Bundle-40/src/**'
      - 'Bundle-40/qa/**'
  workflow_dispatch:
concurrency:
  group: bundle40-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JSX and CSS verification tools
        run: npm install --no-audit --no-fund --no-save esbuild@0.25.12 typescript@5.8.3 react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - name: Test precise homepage and Letters changes
        run: node Bundle-40/qa/check-bundle40.mjs
      - name: Parse and bundle-check app JSX without unrelated private repo source
        run: |
          ./node_modules/.bin/esbuild Bundle-40/src/App.tsx --bundle --external:* --format=esm --target=es2022 --outfile=/tmp/b40-app.js
          ./node_modules/.bin/esbuild Bundle-40/src/letters/LettersEntry.tsx --bundle --external:* --format=esm --target=es2022 --outfile=/tmp/b40-entry.js
          ./node_modules/.bin/esbuild Bundle-40/src/index.css --outfile=/tmp/b40-index.css
          ./node_modules/.bin/esbuild Bundle-40/src/letters/LettersEntry.css --outfile=/tmp/b40-entry.css
          test -s /tmp/b40-app.js
          test -s /tmp/b40-entry.js
      - name: Strict typecheck isolated Letters entry
        run: |
          mkdir -p .qa40/src/letters
          cp Bundle-40/src/letters/LettersEntry.tsx .qa40/src/letters/
          cp Bundle-40/src/letters/LettersEntry.css .qa40/src/letters/
          printf "declare module '*.css';\n" > .qa40/global.d.ts
          cat > .qa40/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"strict":true,"noEmit":true,"jsx":"react-jsx","skipLibCheck":true,"allowSyntheticDefaultImports":true,"types":["react","react-dom"]},"include":["./src/letters/**/*.tsx","./global.d.ts"]}
          JSON
          ./node_modules/.bin/tsc -p .qa40/tsconfig.json
      - name: Build one Figma Make ZIP with only changed files
        run: |
          cd Bundle-40
          rm -f Changes-Only.zip
          touch -t 202601010101 src/App.tsx src/index.css src/letters/LettersEntry.tsx src/letters/LettersEntry.css
          zip -X -9 -q Changes-Only.zip src/App.tsx src/index.css src/letters/LettersEntry.tsx src/letters/LettersEntry.css
          unzip -Z1 Changes-Only.zip | sort > /tmp/b40-actual.txt
          printf '%s\n' src/App.tsx src/index.css src/letters/LettersEntry.tsx src/letters/LettersEntry.css | sort > /tmp/b40-expected.txt
          diff -u /tmp/b40-expected.txt /tmp/b40-actual.txt
          unzip -t Changes-Only.zip
      - name: Commit verified ZIP to changes repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-40/Changes-Only.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle 40: tested changes-only Figma Make UI ZIP'
            git fetch origin main
            git rebase origin/main
            git push
          fi
