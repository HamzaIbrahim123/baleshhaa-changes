name: Bundle 34 hotfix — verify room join rate limiter
on:
  push:
    paths:
      - '.github/workflows/test-bundle34-join-hotfix.yml'
      - 'Bundle-34/qa/join-limiter-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check join endpoint returns 404 (not 500) without touching an actual room
        run: node Bundle-34/qa/join-limiter-smoke.mjs
