name: Bundle 28 - Verify and pack changes only
on:
  push:
    paths:
      - '.github/workflows/build-bundle28.yml'
      - 'Bundle-28/src/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript and React type dependencies
        run: npm install --no-audit --no-fund --no-save typescript@5.8.3 esbuild@0.25.12 @types/react@19 @types/react-dom@19
      - name: Strict typecheck host and viewer modules
        run: |
          mkdir -p .qa28/src/letters
          cp Bundle-24/src/letters/engine.ts .qa28/src/letters/
          cp Bundle-25/src/letters/roomClient.ts .qa28/src/letters/
          cp Bundle-28/src/letters/*.tsx Bundle-28/src/letters/*.css .qa28/src/letters/
          cp Bundle-26/src/letters/RoomLobby.css .qa28/src/letters/
          printf "declare module '*.css';\n" > .qa28/global.d.ts
          cat > .qa28/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM","DOM.Iterable"],"strict":true,"noEmit":true,"jsx":"react-jsx","skipLibCheck":true,"allowSyntheticDefaultImports":true,"types":["react","react-dom"]},"include":["./src/letters/**/*.ts","./src/letters/**/*.tsx","./global.d.ts"]}
          JSON
          ./node_modules/.bin/tsc -p .qa28/tsconfig.json
          ./node_modules/.bin/esbuild Bundle-28/src/letters/HostGameControls.tsx --format=esm --outfile=/tmp/bundle28-host.js
      - name: Verify server-based gameplay transitions and no Seen Jeem changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const host=fs.readFileSync('Bundle-28/src/letters/HostGameControls.tsx','utf8');
          const lobby=fs.readFileSync('Bundle-28/src/letters/RoomLobby.tsx','utf8');
          for(const kind of ['open_question','correct_answer','wrong_answer','both_surrender','retry_same_letter','toggle_edit_mode','cycle_cell_color','next_round','end_match']){
            assert.match(host,new RegExp("kind: '"+kind+"'"));
          }
          assert.match(host,/roomApi\.command\(room\.room\.code, room\.room\.revision, command, crypto\.randomUUID\(\)\)/);
          assert.match(lobby,/<HostGameControls room=\{room\} onUpdate=\{setRoom\}/);
          assert.doesNotMatch(host,/localStorage\.|DATABASE_URL|VITE_LETTERS_ROOM_API_BASE/);
          console.log('Bundle 28 safeguards passed');
          JS
      - name: Build ONE ZIP with only changed files
        run: |
          cd Bundle-28
          zip -q Changes-Only.zip src/letters/RoomLobby.tsx src/letters/HostGameControls.tsx src/letters/HostGameControls.css
          unzip -Z1 Changes-Only.zip | sort > /tmp/actual28.txt
          printf '%s\n' 'src/letters/RoomLobby.tsx' 'src/letters/HostGameControls.tsx' 'src/letters/HostGameControls.css' | sort > /tmp/expected28.txt
          diff -u /tmp/expected28.txt /tmp/actual28.txt
          unzip -t Changes-Only.zip
      - name: Commit verified ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-28/Changes-Only.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build Bundle 28 changes-only ZIP'
            git push
          fi
