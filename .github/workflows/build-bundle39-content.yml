name: Bundle 39 — Validate Arabic quiz expansion and generate DB-only seed
on:
  push:
    paths:
      - '.github/workflows/build-bundle39-content.yml'
      - 'Bundle-39/content/**'
  workflow_dispatch:
concurrency:
  group: bundle39-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check all 2209 questions for duplicates, clue leak and letter/difficulty validity
        run: node Bundle-39/content/validate-and-seed.mjs
      - name: Produce idempotent SQL for 529 new questions only
        run: |
          node Bundle-39/content/validate-and-seed.mjs --sql > Bundle-39/content/seed-added-529.sql
          test "$(grep -c 'INSERT INTO public.letter_questions' Bundle-39/content/seed-added-529.sql)" -eq 7
      - name: Commit deterministic SQL for audit and replay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-39/content/seed-added-529.sql
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle 39: validated idempotent SQL for 529 additional Arabic questions'
            git fetch origin main
            git rebase origin/main
            git push
          fi
