name: Bundle 38 — Editorial content integrity and SQL generation
on:
  push:
    paths:
      - '.github/workflows/build-bundle38-content.yml'
      - 'Bundle-38/content/**'
  workflow_dispatch:
concurrency:
  group: bundle38-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject duplicate, off-letter, leaked or malformed questions
        run: node Bundle-38/content/validate-and-seed.mjs
      - name: Generate deterministic, idempotent seed SQL
        run: |
          node Bundle-38/content/validate-and-seed.mjs --sql > Bundle-38/content/seed-added-700.sql
          test "$(grep -c 'INSERT INTO public.letter_questions' Bundle-38/content/seed-added-700.sql)" -eq 5
      - name: Commit verified SQL only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-38/content/seed-added-700.sql
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle 38: generate verified 700-question idempotent seed SQL'
            git fetch origin main
            git rebase origin/main
            git push
          fi
