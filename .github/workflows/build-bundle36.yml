name: Bundle 36 — Host UX, hex tessellation, and room setup QA
on:
  push:
    paths:
      - '.github/workflows/build-bundle36.yml'
      - 'Bundle-36/src/**'
  workflow_dispatch:
concurrency:
  group: bundle36-verified-zip
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript, React and JSX build tools
        run: npm install --no-audit --no-fund --no-save typescript@5.8.3 esbuild@0.25.12 react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - name: Strict check of BOTH presenter and spectator screens
        run: |
          mkdir -p .qa36/src/letters
          cp Bundle-24/src/letters/engine.ts .qa36/src/letters/engine.ts
          cp Bundle-36/src/letters/* .qa36/src/letters/
          printf "declare module '*.css';\n" > .qa36/global.d.ts
          cat > .qa36/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM","DOM.Iterable"],"strict":true,"noEmit":true,"jsx":"react-jsx","skipLibCheck":true,"allowSyntheticDefaultImports":true,"types":["react","react-dom"]},"include":["./src/letters/**/*.ts","./src/letters/**/*.tsx","./global.d.ts"]}
          JSON
          ./node_modules/.bin/tsc -p .qa36/tsconfig.json
          ./node_modules/.bin/esbuild .qa36/src/letters/RoomLobby.tsx --format=esm --outfile=/tmp/Bundle36-RoomLobby.js
          ./node_modules/.bin/esbuild .qa36/src/letters/HostGameControls.tsx --format=esm --outfile=/tmp/Bundle36-HostControls.js
      - name: Verify geometry, required setup, explicit recovery and clickable question
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=file=>fs.readFileSync('Bundle-36/src/letters/'+file,'utf8');
          const lobby=read('RoomLobby.tsx'),host=read('HostGameControls.tsx'),
                layout=read('RoomLobby.css'),skin=read('HostGameControls.css'),client=read('roomClient.ts');
          // A pointy top, tight staggered 5x5 grid is shared by presenter and viewer.
          assert.match(layout,/polygon\(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%\)/);
          assert.match(layout,/grid-template-columns: repeat\(5, var\(--lr-hex-w\)\)/);
          assert.match(layout,/grid-template-rows: repeat\(5, calc\(var\(--lr-hex-h\) \* \.75\)\)/);
          assert.match(layout,/translateX\(calc\(var\(--lr-hex-w\) \* \.5\)\)/);
          assert.match(layout,/font-family: Cairo, Tajawal/);
          assert.match(layout,/--lr-hex-face: #f9f9ff/);
          assert.match(layout,/--lr-hex-stroke: #ffdb64/);
          assert.match(skin,/filter: drop-shadow\(0 0 11px/);
          assert.match(lobby,/letters-room__hex--selected/);
          // No implicit reuse of an old room, or implicit selection of best-of format.
          assert.match(lobby,/useState<BestOf \| null>\(null\)/);
          assert.match(lobby,/if \(code\) setRoom\(result\)/);
          assert.match(lobby,/else setRecovered\(result\)/);
          assert.match(lobby,/استكمال الغرفة السابقة/);
          assert.match(lobby,/إنهاء الغرفة السابقة وإنشاء جديدة/);
          assert.match(lobby,/recoveredConfirm/);
          assert.match(lobby,/!nickname\(team1\) \|\| !nickname\(team2\) \|\| !bestOf/);
          assert.match(lobby,/room\.room\.revision,\{kind:'end_match'\}/);
          // Current letter is clickable; previous wrong-answer actions are gone.
          assert.match(host,/const focused=state\.focusedCell\?\?state\.currentCell\?\?null/);
          assert.match(host,/if\(cell===focused\)return state\.stage==='playing'\|\|Boolean\(current&&!current\.revealed\)/);
          assert.match(host,/if\(editing\|\|cell===focused\)void send\(\{kind:'cycle_cell_color',cell\}\)/);
          assert.match(host,/data-bundle="36"/);
          assert.doesNotMatch(host,/correct_answer|wrong_answer|إجابة صحيحة للفريق/);
          assert.doesNotMatch(lobby,/بنك أسئلة الحروف رح يكتمل|تعديل ألوان الحروف/);
          assert.match(client,/counts: \(code: string\)/);
          assert.match(client,/br-autumn-pond-b92zfumu-baleshhaarooms/);
          console.log('PASS: seamless pointy-top hex geometry, selected border, manual game setup, safe resume and direct clickable current cell.');
          JS
      - name: Recheck server-side question/ownership rules and question bank
        run: |
          node Bundle-35/qa/server-contracts.mjs
          node Bundle-35/content/validate-and-seed.mjs
      - name: Package one ZIP with ONLY 5 replaced UI files
        run: |
          cd Bundle-36
          touch -t 202601010101 src/letters/RoomLobby.tsx src/letters/RoomLobby.css src/letters/HostGameControls.tsx src/letters/HostGameControls.css src/letters/roomClient.ts
          zip -X -q Changes-Only.zip src/letters/RoomLobby.tsx src/letters/RoomLobby.css src/letters/HostGameControls.tsx src/letters/HostGameControls.css src/letters/roomClient.ts
          unzip -Z1 Changes-Only.zip | sort > /tmp/b36-actual.txt
          printf '%s\n' src/letters/RoomLobby.tsx src/letters/RoomLobby.css src/letters/HostGameControls.tsx src/letters/HostGameControls.css src/letters/roomClient.ts | sort > /tmp/b36-expected.txt
          diff -u /tmp/b36-expected.txt /tmp/b36-actual.txt
          unzip -t Changes-Only.zip
      - name: Commit the verified changes-only ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bundle-36/Changes-Only.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build Bundle 36 verified five-file changes-only ZIP'
            git fetch origin main
            git rebase origin/main
            git push
          fi
