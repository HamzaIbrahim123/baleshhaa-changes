name: Bundle 38 — QA live question inventory and non-repetition
on:
  push:
    paths:
      - '.github/workflows/test-bundle38-qa.yml'
      - 'Bundle-38/qa/live-question-inventory.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate 60 real questions per letter and no repeating after surrender
        run: node Bundle-38/qa/live-question-inventory.mjs
