name: QA Neon Environment Probe
on:
  push:
    paths:
      - '.github/workflows/qa-env-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get only boolean Neon environment flags
        run: |
          set -euo pipefail
          curl -fsS -m 20 'https://br-late-math-b9m0r7gn-baleshhaarooms.compute.c-7.eu-central-1.aws.neon.tech/health' | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x.get("probe"); print("Configured env booleans:",x["present"],"Room key names:",x["roomKeys"])'
